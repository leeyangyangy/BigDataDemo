# SPC Analysis - frontend + backend only
# MySQL / Redis / RabbitMQ run as external standalone services (addresses in .env).
#
# Usage:
#   cp .env.example .env   (edit infra addresses + secrets)
#   docker compose up -d --build
#
# Frontend nginx proxies /api and /actuator to the backend container.
services:
  backend:
    build:
      context: ./cockpit-backend
    container_name: spc-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      # ----- external MySQL (必须配置专用账户, 禁止使用 root) -----
      MYSQL_HOST: ${MYSQL_HOST:-192.168.1.106}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cockpit_all_stack}
      # 安全要求: 不提供 root 默认值, 必须在 .env 中显式配置专用账户
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER must be set in .env (do not use root)}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      MYSQL_SSL_ENABLED: ${MYSQL_SSL_ENABLED:-false}
      MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL: ${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:-false}
      # ----- external Redis -----
      REDIS_HOST: ${REDIS_HOST:-192.168.1.106}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # REDIS_PASSWORD 留空时, application-prod.yml 中 password 解析为空字符串,
      # Redisson 不会发起 AUTH, 兼容无密码 Redis。
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # ----- external RabbitMQ (必须配置专用账户, 禁止使用 guest) -----
      RABBITMQ_HOST: ${RABBITMQ_HOST:-192.168.1.106}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set in .env (do not use guest)}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-collect_data_vhost}
      # ----- secrets (占位符由 application-prod.yml 读取) -----
      # AES key/iv 由前端随机生成、RSA 加密上送, 见 /api/auth/key-exchange,
      # 不再从环境变量读取静态值, 见 RsaKeyHolder / CryptoKeyService。
      # COCKPIT_JWT_SECRET 留空时, 后端按 cockpit.jwt.random-secret-on-startup 启用随机密钥
      # (单实例部署可用, 重启后所有Token失效)。
      COCKPIT_JWT_SECRET: ${COCKPIT_JWT_SECRET:-}
      COCKPIT_ALLOWED_ORIGINS: ${COCKPIT_ALLOWED_ORIGINS:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./cockpit-dashboard
    container_name: spc-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
