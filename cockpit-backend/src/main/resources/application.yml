server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: spc-analysis

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.106:3306/cockpit_all_stack?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 30
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

  redis:
    host: 192.168.1.106
    port: 6379
    database: 0
    timeout: 5000
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000

  rabbitmq:
    host: 192.168.1.106
    port: 5672
    username: root
    password: password
    virtual-host: collect_data_vhost
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        concurrency: 3
        max-concurrency: 6
        default-requeue-rejected: false
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: xyz.leeyangy.spc.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    xyz.leeyangy.spc: debug
    com.baomidou.mybatisplus: debug

spc:
  data:
    shard-enabled: false
  ws:
    push:
      enabled: false
      interval: 5000
  security:
    encryption:
      enabled: true
      key: SPC@2026#Secure!Key
      iv: SPC2026SecureIV16
      exclude-paths:
        - /auth/login
        - /auth/info
        - /actuator/**
        - /swagger-ui/**
        - /v3/api-docs/**
  wecom:
    corpId: wwYOUR_CORP_ID
    agentId: YOUR_AGENT_ID
    secret: YOUR_APP_SECRET
    enabled: false
  jwt:
    secret: SPC-Process-Control-System-JWT-Secret-Key-2026-Enterprise
    random-secret-on-startup: true
#    expiration: 7200000     # 2 H
#    expiration: 28800000     # 8 H
    expiration: 86400000  # 24 H
#    expiration: 604800000      # 7 D
#    expiration: 2592000000     # 30 D
