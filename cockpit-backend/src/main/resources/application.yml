server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: spc-analysis

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.106:3306/cockpit_all_stack?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 30
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

  redis:
    host: 192.168.1.106
    port: 6379
    database: 0
    timeout: 5000
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000

  rabbitmq:
    host: 192.168.1.106
    port: 5672
    username: root
    password: password
    virtual-host: collect_data_vhost
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        concurrency: 3
        max-concurrency: 6
        default-requeue-rejected: false
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: xyz.leeyangy.spc.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    xyz.leeyangy.spc: debug
    com.baomidou.mybatisplus: debug

cockpit:
  data:
    shard-enabled: false
  ws:
    push:
      enabled: false
      interval: 5000
  security:
    encryption:
      enabled: true
      exclude-paths:
        - /api/auth/login
        - /api/auth/info
        - /api/auth/public-key
        - /api/auth/key-exchange
        - /api/actuator/**
        - /api/swagger-ui/**
        - /api/v3/api-docs/**
        - /api/spc/data/export/**
    password:
      history-count: 5  # 密码历史保留数量 (等保三级防重用)
      max-age-days: 90  # 密码最长使用天数 (等保三级: 定期更换)
  wecom:
    corpId: wwYOUR_CORP_ID
    agentId: YOUR_AGENT_ID
    secret: YOUR_APP_SECRET
    enabled: false
  jwt:
    # 开发环境默认启用随机密钥, 重启后所有Token失效。
    # 生产环境通过 application-prod.yml 配置 COCKPIT_JWT_SECRET (>=32字节) 或保持启用随机密钥。
    random-secret-on-startup: true
    expiration: 28800000  # 8 H (符合等保三级 会话超时要求)
  cors:
    allowed-origins: http://localhost:5174,http://localhost:5173,http://127.0.0.1:5174,http://192.168.1.111:5174

  # 限流配置 (等保三级: 登录失败处理 + API 限流)
  rate-limit:
    login:
      max-attempts: 5        # 5 次失败后锁定 (开发环境调高方便调试, 生产环境用 application-prod.yml)
      window-seconds: 300    # 5 分钟窗口
      lockout-seconds: 1800  # 锁定 30 分钟
    api:
      max-requests: 500
      window-seconds: 60

  # 密码策略 (等保三级: 密码历史 + 强度校验) - 已合并到上方 cockpit.security 块

  # SPC 报告相关配置(年份自动取当前年份,无需手动修改)
  report:
    company-name: 飾芯科技
    company-website: https://hurricanechip.com/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
